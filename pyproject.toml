[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-plan-auth"
version = "1.0.0"
description = "Sign in with ChatGPT (ChatGPT plan usage) for locally hosted apps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Michael Guber", email = "michael@guber.dev" }]
keywords = ["chatgpt", "oauth", "openai", "pkce", "siwc"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The OpenAI SDK wrapper (`chatgpt_plan_auth.client`). The protocol code in
# `auth`, `catalog` and `requests` never imports it.
openai = ["openai>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openai>=1.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_plan_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
testpaths = ["tests"]
