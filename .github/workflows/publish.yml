name: Publish to PyPI

# Trusted publishing: no API token anywhere, and the publish action uploads
# PEP 740 attestations so the provenance of a release can be verified from PyPI.
#   1. https://pypi.org/manage/account/publishing/ -> "Add a new pending publisher"
#      PyPI Project Name: chatgpt-plan-auth
#      Owner: guberm
#      Repository name: chatgpt-plan-auth
#      Workflow name: publish.yml
#      Environment name: (leave empty)
#   2. Push a tag:  git tag v1.0.0 && git push origin v1.0.0
# After the first release the publisher is no longer "pending".

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Publish to PyPI
        # `pypa/gh-action-pypi-publish` uploads with trusted publishing and adds
        # the PEP 740 attestation that Home Assistant's dependency check looks
        # for. The workflow only runs on tag pushes, so no event data reaches it.
        uses: pypa/gh-action-pypi-publish@release/v1
